name: CapLauncher Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Apply CapLauncher files
        run: unzip -o CapLauncher-ozgargan-fayllar.zip

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          gradle :app_mojo:assembleFullDebug
          mkdir out
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/CapLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapLauncher-APK
          path: out/CapLauncher.apk
